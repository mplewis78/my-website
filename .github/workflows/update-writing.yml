name: Update writing page from Substack

on:
  # Run every Tuesday at 10 AM UTC
  # (Mike & Ned typically publishes Monday/Tuesday)
  schedule:
    - cron: '0 10 * * 2'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the commit

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        run: python3 scripts/update_writing.py

      - name: Commit and push if writing.html changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add writing.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update writing page from Substack feeds"
            git push
          fi
